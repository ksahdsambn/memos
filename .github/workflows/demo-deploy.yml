name: Demo Deploy

on:
  workflow_dispatch:

jobs:
  deploy-demo:
    runs-on: [self-hosted, Linux, X64, dartnode-linux, dartnode-build]
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"trigger": "github_action"}'

      - name: Deployment Status
        run: echo "Demo deployment triggered successfully on Render"
    if: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
